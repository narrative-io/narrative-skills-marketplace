# Creates the synthetic dataset, then appends every chunk of rows to it.
#
# Steps run in order and there is no parallelism, so the create step is
# finished before the first append starts. That ordering is the reason
# this is a workflow rather than a sequence of separate calls.
#
# Substitute before submitting:
#
#   <SLUG>        kebab-case run name, e.g. dog-breed
#   <VIEW_NAME>   the synthetic dataset name, e.g. dog_breed_train_synthetic
#   <SEED_NQL>    the body of 02-synthetic-seed.sql
#   <CHUNK_N>     the body of 03-synthetic-insert.sql, one task per chunk
#
# Add one insertChunk task per chunk. Roughly 500 rows per chunk keeps
# each statement small enough to read and to locate a quoting error in.
#
# Re-running this workflow appends a second copy of every row:
# CreateMaterializedViewIfNotExists skips the create when the dataset is
# already there, and the ExecuteDml steps append regardless. To re-run,
# either use a new <VIEW_NAME> or delete the dataset first.

document:
  dsl: '1.0.0'
  namespace: ml
  name: <SLUG>-synthetic-training-rows
  version: '1.0.0'

do:
  - createSyntheticView:
      call: CreateMaterializedViewIfNotExists
      with:
        nql: |
          <SEED_NQL>

  - insertChunk1:
      call: ExecuteDml
      with:
        nql: |
          <CHUNK_1>

  - insertChunk2:
      call: ExecuteDml
      with:
        nql: |
          <CHUNK_2>
